# .github/workflows/backlink-monitor.yml
name: Backlink Monitor
on:
  schedule:
    - cron: "0 1 * * 1"   # setiap Senin 08:00 WIB
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/check_backlinks.py data/sources.csv > report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: backlink-report
          path: report.csv
